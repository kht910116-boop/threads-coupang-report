# 포장 설정.
#
# package.json이 아니라 여기에 둔 이유는 JSON에 주석을 달 수 없기 때문이다.
# 이 파일의 값들은 대부분 "왜 그래야 하는지"를 알아야 안 건드리게 되는 것들이다.

appId: com.kht.autotube
productName: AutoTube Studio

# 서버를 별도 Node 프로세스로 spawn하고, playwright가 브라우저 프로파일 경로를
# 직접 만진다. 둘 다 asar 안에서는 깨진다.
asar: false

# 서버 트리는 files가 아니라 extraResources로 옮긴다.
#
# electron-builder는 files 패턴에 뭐라고 쓰든 "node_modules"라는 이름의 디렉터리를
# 특별 취급해서 빼버린다(원래는 package.json의 dependencies를 보고 자기가 채워 넣는
# 자리라서 그렇다). 그래서 .next/standalone을 files로 넣으면 node_modules만 쏙 빠진
# 껍데기가 들어가고, 서버가 next를 못 찾아 창이 아예 뜨지 않는다. 실제로 그렇게 깨졌다.
# extraResources는 그 특별 취급 없이 있는 그대로 복사한다.
#
# 루트 package.json에 dependencies를 두지 않은 것도 같은 맥락이다. 거기에 next·react가
# 있으면 electron-builder가 루트 node_modules를 통째로 복사해 넣는다. 포장된 앱이
# 실행 시점에 필요로 하는 것은 electron뿐이고, 서버가 쓰는 모듈은 next build가
# .next/standalone/node_modules에 이미 추려 넣었다.
files:
  - electron/**
  - package.json

extraResources:
  - from: .next/standalone
    to: server

win:
  target:
    - nsis
  # 서명서가 없다. 실행 파일을 편집하려 들면 빌드가 실패한다.
  signAndEditExecutable: false

nsis:
  # 한 번 클릭으로 Program Files에 밀어 넣지 않는다. 거기는 쓰기 권한이 없어
  # data 폴더를 실행 파일 옆에 둘 수 없고, 그러면 결과물을 찾기 어려워진다.
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
  createDesktopShortcut: true
  shortcutName: AutoTube Studio
